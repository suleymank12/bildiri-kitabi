# The API address is resolved at run time through Docker's embedded DNS, not once at startup: after a restart the
# API container may come back with another IP address, and nginx still starts while the API is down.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

upstream api_backend {
    zone api_backend 64k;
    server api:8080 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    # Ten papers of up to 10 MB each; the API itself allows 70 MB per request.
    client_max_body_size 70m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml application/wasm;

    # The API: uploads stream straight through (upload progress in the browser stays accurate), generation and
    # large downloads get generous time limits. The API reads the client address from X-Forwarded-For.
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Hashed build output never changes under the same name.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        types {
            text/javascript js mjs;
            text/css css;
            font/woff2 woff2;
            font/woff woff;
            image/svg+xml svg;
            application/wasm wasm;
        }
        try_files $uri =404;
    }

    # pdf.js data files (character maps, standard fonts, decoders, colour profiles).
    location /pdfjs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        types {
            text/javascript js mjs;
            application/wasm wasm;
            application/octet-stream bcmap pfb ttf icc;
        }
        default_type application/octet-stream;
        try_files $uri =404;
    }

    # The single-page app: every other path is a client route.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
